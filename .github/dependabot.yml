version: 2

updates:
  # ── Backend (Node) ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, backend, security]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    # Major upgrades are surfaced by the security advisories path but are never
    # proposed automatically here: they carry breaking changes and must be
    # planned, not merged from a bot PR. See SECURITY.md § Dependency
    # remediation workflow.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      backend-patch:
        patterns: ["*"]
        update-types: [patch]
      backend-minor:
        patterns: ["*"]
        update-types: [minor]

  # ── Frontend (Node) ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, frontend, security]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      frontend-patch:
        patterns: ["*"]
        update-types: [patch]
      frontend-minor:
        patterns: ["*"]
        update-types: [minor]

  # ── Shared workspace (Node) ───────────────────────────────────────────────
  # shared/ has its own package.json and is imported by the backend at
  # runtime, so it is a real dependency surface and is scanned like the others.
  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels: [dependencies, shared, security]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # ── Soroban contract (Cargo) ──────────────────────────────────────────────
  # soroban-sdk is pinned with `=` in Cargo.toml. Dependabot will not move a
  # pinned requirement, so contract SDK upgrades stay a deliberate, reviewed
  # change; this entry still surfaces advisories for the rest of the tree.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels: [dependencies, contract, security]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # A compromised or stale action runs with repository credentials, so the
  # CI toolchain is treated as a dependency surface in its own right.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, ci, security]
    commit-message:
      prefix: "chore(ci)"
      include: scope
