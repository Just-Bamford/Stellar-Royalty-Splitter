name: Terraform CI

# Validation for the Infrastructure as Code configuration (#870).
#
# Runs format, init, and validate for every module and environment on any
# change under infra/terraform/. When AWS credentials are configured as
# repository secrets it also runs `terraform plan` for development and posts
# the result on the pull request, so an infrastructure change is reviewable as
# a diff of what it will actually do — not just as a diff of HCL.
#
# The plan step is skipped, not failed, when credentials are absent: a fork
# pull request cannot have them, and failing there would block contributors
# from a check they cannot satisfy.

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TERRAFORM_VERSION: "1.9.8"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

  validate:
    name: Validate ${{ matrix.path }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing module, not just the first.
      fail-fast: false
      matrix:
        path:
          - modules/network
          - modules/security
          - modules/storage
          - modules/secrets
          - modules/compute
          - modules/frontend
          - modules/monitoring
          - environments/dev
          - environments/staging
          - environments/prod

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform init
        # -backend=false: validation needs the providers and modules resolved,
        # not remote state. This is what lets every module and environment be
        # validated without any AWS access at all.
        working-directory: infra/terraform/${{ matrix.path }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra/terraform/${{ matrix.path }}
        run: terraform validate -no-color

  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run tflint
        working-directory: infra/terraform
        run: |
          tflint --init
          tflint --recursive --format compact

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: cli

  plan:
    name: Plan (dev)
    runs-on: ubuntu-latest
    needs: [format, validate]
    # Skipped on fork pull requests, which cannot access repository secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Check for AWS credentials
        id: creds
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Plan skipped::AWS_ROLE_ARN is not configured, so terraform plan cannot run. Format and validate still cover the configuration."
          fi

      - name: Configure AWS credentials
        if: steps.creds.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # OIDC rather than long-lived access keys: no static credentials in
          # repository secrets, and the role can be scoped to this repository.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v4
        if: steps.creds.outputs.available == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform init
        if: steps.creds.outputs.available == 'true'
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: terraform plan
        if: steps.creds.outputs.available == 'true'
        id: plan
        working-directory: infra/terraform/environments/dev
        run: |
          set +e
          terraform plan -no-color -input=false -lock=false -out=tfplan > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e
          # Keep the comment inside GitHub's 65 536-character limit.
          head -c 60000 plan.txt > plan-truncated.txt
          if [ "$(wc -c < plan.txt)" -gt 60000 ]; then
            echo "" >> plan-truncated.txt
            echo "... output truncated; see the workflow log for the full plan." >> plan-truncated.txt
          fi

      - name: Comment plan on the pull request
        if: steps.creds.outputs.available == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const plan = fs.readFileSync(
              "infra/terraform/environments/dev/plan-truncated.txt", "utf8");
            const failed = "${{ steps.plan.outputs.exitcode }}" !== "0";
            const marker = "<!-- terraform-plan-dev -->";

            const body = [
              marker,
              `## Terraform plan — development ${failed ? "❌" : "✅"}`,
              "",
              "<details><summary>Show plan</summary>",
              "",
              "```terraform",
              plan,
              "```",
              "",
              "</details>",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === "Bot" && c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if the plan failed
        if: steps.creds.outputs.available == 'true' && steps.plan.outputs.exitcode != '0'
        run: |
          echo "::error title=Plan failed::terraform plan returned a non-zero exit code. See the pull request comment or the log above."
          exit 1
