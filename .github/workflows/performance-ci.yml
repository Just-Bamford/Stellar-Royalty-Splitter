name: Performance CI

# Automated performance regression detection (#867).
#
# On a pull request the suite runs and is compared against the committed
# baseline for this runner. A regression that clears every gate fails this job
# — and only this job, so a performance failure is never mistaken for a
# functional one.
#
# On a push to main the suite runs and the result is uploaded as the candidate
# baseline. Promoting it is a deliberate, reviewable act (see
# docs/PERFORMANCE.md) rather than something that happens automatically, so a
# regression that slips through cannot silently become the new normal.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - ".github/workflows/performance-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - ".github/workflows/performance-ci.yml"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold (percent)"
        required: false
        default: ""
      repeat:
        description: "Passes per run; each scenario keeps its best"
        required: false
        default: "3"

# A benchmark is only meaningful if it has the runner to itself. Cancelling an
# in-flight run for the same ref also stops two jobs competing for one machine.
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmarks and regression check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to a single version on purpose: a Node major bump shifts V8
          # performance by more than the regression threshold, which would
          # invalidate every baseline. Bumping this requires re-capturing them.
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install shared dependencies
        # shared/ is its own package with its own dependency on the Stellar
        # SDK; backend/node_modules does not satisfy it.
        working-directory: shared
        run: npm ci

      - name: Run benchmarks
        working-directory: backend
        run: |
          node benchmarks/index.js \
            --repeat "${{ github.event.inputs.repeat || '3' }}" \
            --label "${{ github.sha }}" \
            --json "$RUNNER_TEMP/bench-results.json"

      - name: Compare against baseline
        id: compare
        working-directory: backend
        run: |
          BASELINE="benchmarks/baselines/ci-ubuntu-latest-node20.json"
          THRESHOLD_ARG=""
          if [ -n "${{ github.event.inputs.threshold }}" ]; then
            THRESHOLD_ARG="--threshold ${{ github.event.inputs.threshold }}"
          fi

          set +e
          node benchmarks/compare.js \
            --baseline "$BASELINE" \
            --current "$RUNNER_TEMP/bench-results.json" \
            --markdown "$RUNNER_TEMP/comparison.md" \
            $THRESHOLD_ARG
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Publish comparison
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/comparison.md" ]; then
            cat "$RUNNER_TEMP/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No comparison was produced — the benchmark run failed._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = `${process.env.RUNNER_TEMP}/comparison.md`;
            if (!fs.existsSync(path)) return;

            const body = fs.readFileSync(path, "utf8");
            const marker = "<!-- performance-ci -->";
            const payload = `${marker}\n${body}`;

            // Update the existing comment rather than adding one per push, so
            // the thread stays readable across a long-running pull request.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === "Bot" && c.body?.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # On a push to main this artifact is the candidate baseline: download
          # it, commit it, and open a pull request. See docs/PERFORMANCE.md.
          name: benchmark-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bench-results.json
            ${{ runner.temp }}/comparison.md
          retention-days: 30
          if-no-files-found: warn

      - name: Fail on regression
        # Kept as the last step so the comparison is always published and the
        # results always uploaded, even when the gate fails. A non-zero status
        # here means a performance regression specifically — functional
        # failures surface in Backend CI, never in this job.
        if: github.event_name == 'pull_request' && steps.compare.outputs.status != '0'
        run: |
          echo "::error title=Performance regression::One or more benchmarks regressed beyond the configured threshold. See the job summary and the pull request comment for details."
          exit 1
