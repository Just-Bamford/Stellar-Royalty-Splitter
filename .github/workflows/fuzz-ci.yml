name: Fuzz CI

# Property-based fuzz testing for input validation and contract invocation (#866).
#
# Two cadences, deliberately different:
#   • pull_request — a reduced 200-case subset, so the signal arrives fast and
#     the job stays well inside a normal PR feedback loop.
#   • schedule     — the full 1 000-case run under a fresh random seed, so new
#     input space keeps being explored over time rather than the suite
#     re-testing the same cases forever.
#
# Every run uploads its machine-readable report. A failure prints the seed that
# produced it; re-running locally with that FUZZ_SEED reproduces it exactly.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - "tests/fuzz/**"
      - ".github/workflows/fuzz-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - "tests/fuzz/**"
      - ".github/workflows/fuzz-ci.yml"
  schedule:
    # 03:17 UTC daily — an odd minute to avoid the top-of-hour runner crush.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: "Cases per property"
        required: false
        default: "1000"
      seed:
        description: "Fixed FUZZ_SEED (blank for random)"
        required: false
        default: ""

jobs:
  fuzz:
    name: Property-based fuzz tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Select case count
        id: config
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Controlled subset for PR feedback.
            echo "cases=200" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cases=${{ github.event.inputs.cases }}" >> "$GITHUB_OUTPUT"
          else
            # Scheduled and post-merge runs get the full count required by #866.
            echo "cases=1000" >> "$GITHUB_OUTPUT"
          fi

      - name: Run fuzz suite
        env:
          FUZZ_CASES: ${{ steps.config.outputs.cases }}
          FUZZ_SEED: ${{ github.event.inputs.seed }}
        run: |
          echo "Running ${FUZZ_CASES} cases per property"
          npm run test:fuzz

      - name: Summarise run
        if: always()
        run: |
          {
            echo "## Fuzz run"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Cases per property | ${{ steps.config.outputs.cases }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if ls ../tests/fuzz/reports/*.json >/dev/null 2>&1; then
            {
              echo "| Property | Cases | Seed |"
              echo "|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"
            node -e '
              const { readdirSync, readFileSync } = require("node:fs");
              const dir = "../tests/fuzz/reports";
              for (const file of readdirSync(dir).filter((f) => f.endsWith(".json"))) {
                const report = JSON.parse(readFileSync(`${dir}/${file}`, "utf8"));
                for (const run of report.runs) {
                  console.log(`| ${run.property} | ${run.cases} | ${run.seed} |`);
                }
              }
            ' >> "$GITHUB_STEP_SUMMARY"
            {
              echo ""
              echo "To reproduce a failure locally, run the suite with that seed:"
              echo '```bash'
              echo "cd backend && FUZZ_SEED=<seed> npm run test:fuzz"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No fuzz report was produced — the suite failed before any property completed._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload fuzz reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reports-${{ github.run_id }}
          path: tests/fuzz/reports/*.json
          retention-days: 14
          if-no-files-found: warn
