name: Blue-Green Deploy

# Deploys a candidate (green) contract alongside the one currently serving
# (blue), validates it, switches traffic only after validation passes, then
# monitors and rolls back automatically if post-cutover health fails.
#
# Every stage emits a ::notice or ::error so the deployment and any rollback
# are visible in the workflow log rather than only in the runner's shell.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]
      rollback_window:
        description: "Seconds to monitor after cutover before declaring success"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  # A second deploy mid-cutover would leave blue/green state ambiguous.
  group: blue-green-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Blue-green deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    env:
      STELLAR_NETWORK: ${{ vars.STELLAR_NETWORK }}
      STELLAR_IDENTITY: ${{ vars.STELLAR_IDENTITY }}
      SOROBAN_RPC_URL: ${{ vars.SOROBAN_RPC_URL }}
      HORIZON_URL: ${{ vars.HORIZON_URL }}
      HEALTH_URL: ${{ vars.HEALTH_URL }}
      ROLLBACK_WINDOW: ${{ github.event.inputs.rollback_window }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Show current blue/green state
        run: ./scripts/blue-green-deploy.sh status

      # Migration safety gate. A deployment is not rollback-safe if the new
      # version requires a schema the previous version cannot read, because
      # rolling the contract back would leave the old code against new data.
      - name: Check migration compatibility
        run: |
          # Migrations are declared inline in backend/src/database/core.js
          # against the schema_migrations table, not as separate migration
          # files, so that is the path to watch.
          if git log -1 --name-only --format= HEAD 2>/dev/null \
               | grep -qx 'backend/src/database/core.js'; then
            echo "::warning title=Migration detected::This deploy changes database migrations. Confirm the previous application version can still read the new schema before cutover, or the rollback path is not safe. See DEPLOYMENT.md § Migrations and rollback safety."
          else
            echo "::notice title=No migrations::No migration changes in this deploy"
          fi

      - name: Deploy green, validate, cut over, monitor
        run: |
          echo "::notice title=Blue-green::Starting deploy to ${{ github.event.inputs.environment }}"
          ./scripts/blue-green-deploy.sh deploy

      - name: Report final state
        if: always()
        run: ./scripts/blue-green-deploy.sh status

      # The script rolls back on its own when post-cutover health fails. This
      # is the backstop for the case where the job itself dies mid-deploy.
      - name: Emergency rollback on job failure
        if: failure()
        run: |
          echo "::error title=Deploy failed::Attempting rollback to the previously serving contract"
          ./scripts/blue-green-deploy.sh rollback || {
            echo "::error title=Rollback failed::Manual intervention required. See DEPLOYMENT.md § Emergency manual rollback."
            exit 1
          }
