name: Dependency Security Audit

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"

# Least privilege: this workflow only ever reads the tree.
permissions:
  contents: read

jobs:
  # ── JavaScript ────────────────────────────────────────────────────────────
  # One job per workspace that handles both JS audit and lockfile integrity.
  audit-js:
    name: JS Audit & Lockfile Integrity (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend, shared]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      # `npm ci` installs strictly from the lockfile, so the audit below
      # reports the versions that are actually deployed rather than whatever
      # the range in package.json happens to resolve to today.
      - name: Verify lockfile matches package.json
        run: |
          if ! npm ci --ignore-scripts --dry-run; then
            echo "::error title=Lockfile out of sync::${{ matrix.workspace }}/package-lock.json does not match package.json. Run 'npm install' in ${{ matrix.workspace }}/ and commit the updated lockfile."
            exit 1
          fi

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      # Informational pass: always runs, never fails, gives reviewers the full
      # picture (package, installed version, severity, fixed-in version).
      - name: Report all advisories
        continue-on-error: true
        run: |
          echo "### ${{ matrix.workspace }} — dependency advisories" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=low 2>&1 | tail -n 40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Blocking pass: a non-zero exit here fails the job and the build.
      - name: Fail on high or critical advisories
        run: |
          set -o pipefail
          if ! npm audit --audit-level=high; then
            echo "::error title=Vulnerable dependency::${{ matrix.workspace }} has high or critical advisories. Run 'npm audit' locally, then follow SECURITY.md § Dependency remediation workflow. Do not run 'npm audit fix --force'."
            exit 1
          fi

  # ── Rust / Soroban contract ───────────────────────────────────────────────
  audit-rust:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force

      # Advisories that are known, reviewed, and cannot currently be fixed are
      # listed explicitly in .cargo/audit.toml with a rationale and a review
      # date. Anything NOT on that list fails the build.
      #
      # Previously this step was `cargo audit || echo ...` with
      # continue-on-error: true, which meant no Rust advisory — including a
      # critical one — could ever fail CI.
      - name: Run cargo audit
        run: |
          if ! cargo audit --deny warnings; then
            echo "::error title=Vulnerable Rust dependency::cargo-audit reported an advisory that is not in the reviewed allowlist. See .cargo/audit.toml and SECURITY.md § Dependency remediation workflow."
            exit 1
          fi

      - name: Summarize advisories
        if: always()
        continue-on-error: true
        run: |
          echo "### Cargo advisories" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo audit 2>&1 | tail -n 40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
