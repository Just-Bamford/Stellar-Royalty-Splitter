name: Enforce Dev Branch for PRs

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  enforce-dev-branch:
    name: Redirect to dev branch
    runs-on: ubuntu-latest
    steps:
      - name: Close PR and post comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const headBranch = context.payload.pull_request.head.ref;
            const baseBranch = context.payload.pull_request.base.ref;

            // Comment on the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `⚠️ **PR opened against \`main\` instead of \`dev\`**

This repository uses a branching strategy where all development work should target the **\`dev\`** branch. The \`main\` branch is reserved for stable releases.

**Please do the following:**
1. Close this PR
2. Create a new PR with the same changes, but target the **\`dev\`** branch instead

You can reopen this PR by targeting \`dev\` in your PR settings, or create a new one from your feature branch against \`dev\`.

Thank you!`
            });

            // Close the PR
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              state: 'closed'
            });

            console.log(`PR #${prNumber} closed with redirect message`);
