[package]
name = "stellar-royalty-splitter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=20.0.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "=20.0.0", features = ["testutils"] }
proptest = { version = "1.5", features = ["std"] }
stellar-royalty-splitter = { path = ".", features = ["testutils"] }
criterion = { version = "0.5", features = ["html_reports"] }

[features]
testutils = ["soroban-sdk/testutils"]

[[bench]]
name = "royalty_distribution"
harness = false


[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[patch.crates-io]
ethnum = { path = "./ethnum-patch" }
# stellar-xdr 20.0.0 was built against arbitrary 1.1.3. derive_arbitrary >= 1.4.0
# introduced try_size_hint which is absent from the generated code in stellar-xdr 20.0.0,
# causing compilation errors. Pin both to the last compatible 1.3.x releases.
arbitrary = "=1.3.2"
derive_arbitrary = "=1.3.2"
